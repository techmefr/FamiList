# Starting point for the merge request F-Droid's own inclusion process needs — submitted by hand to
# https://gitlab.com/fdroid/fdroiddata, this repository cannot open that merge request itself. Kept here so
# the next submission attempt starts from a checked draft instead of a blank one.
#
# Format: https://f-droid.org/docs/Build_Metadata_Reference/

Categories:
  - Shopping
License: AGPL-3.0-or-later
AuthorName: techmefr
SourceCode: https://github.com/techmefr/familist
IssueTracker: https://github.com/techmefr/familist/issues
Changelog: https://github.com/techmefr/familist/releases

AutoName: FamiList
RepoType: git
Repo: https://github.com/techmefr/familist.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    # No tag exists in the repository yet — `git tag` is empty. F-Droid builds from a fixed commit or tag,
    # never a branch, so a real release tag has to exist before this recipe can point at one.
    commit: v1.0
    subdir: android
    # The unresolved part of this recipe: F-Droid's build server has no network access once the build
    # starts, and this app's `android/` directory is not self-contained — the Gradle build packages
    # `build/` (the compiled SvelteKit output), which `pnpm build` produces from `src/`, itself pulled in
    # through `pnpm install`. Either every JS dependency needs to be vendored ahead of time (an
    # `srclibs`/prebuild step F-Droid supports for exactly this), or the web build has to be committed as a
    # build artifact for the tagged release — neither is set up yet. Flagged in #256 rather than guessed at
    # here.
    prebuild:
      - pnpm install --frozen-lockfile
      - pnpm build
      - pnpm exec cap sync android
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1
