<!doctype html>
<html lang="fr" dir="ltr">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
		/>
		<meta name="theme-color" content="#f1ede5" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<script>
			// Applique les préférences avant le premier rendu : sans ça, un rechargement en thème
			// sombre, en grande police ou en arabe provoque un flash dans les réglages par défaut.
			// Aucune valeur de style ici : les couleurs et les crans vivent dans app.css.
			(() => {
				const root = document.documentElement;

				try {
					const saved = JSON.parse(localStorage.getItem('familist:appearance') ?? '{}');
					const dark =
						saved.theme === 'dark' ||
						((saved.theme ?? 'system') === 'system' &&
							matchMedia('(prefers-color-scheme: dark)').matches);

					if (dark) root.classList.add('dark');
					root.dataset.accent = saved.accentId ?? 'terracotta';
					root.dataset.scale = saved.fontScaleId ?? 'sm';
					root.dataset.font = saved.fontId ?? 'system';
					// Le mouvement est refusé avant la première image, sinon les entrées de la
					// première page jouent quand même.
					root.dataset.motion = saved.motion ?? 'system';
					// Le côté du pouce est posé ici aussi : appliqué après coup, le bouton de
					// création traverserait l'écran sous les yeux de la personne.
					root.dataset.hand = saved.hand ?? 'right';

					if (dark) {
						document
							.querySelector('meta[name="theme-color"]')
							.setAttribute('content', '#0a0907');
					}
				} catch {}

				try {
					const locale = localStorage.getItem('familist:locale');
					if (locale) {
						root.lang = locale;
						root.dir = locale === 'ar' ? 'rtl' : 'ltr';
					}
				} catch {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
