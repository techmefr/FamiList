name: Mirror to private deploy repo

on:
  push:
    branches: [main]

jobs:
  mirror:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to techmefr/familiste
        run: |
          git remote add private "https://x-access-token:${SYNC_TOKEN}@github.com/techmefr/familiste.git"
          git push private HEAD:main
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
