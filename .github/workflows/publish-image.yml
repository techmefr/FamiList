name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# One publication at a time per ref: two close pushes to main would push two images under the same
# `latest` tag, and the last one to arrive would not necessarily be the newest.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # amd64 and arm64: a home server is often a Raspberry Pi or a Mac. The second architecture is
      # emulated, which makes the build longer, but spares those machines from compiling themselves
      # what the image is precisely meant to spare them.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows main, because that is what `compose.yml` asks for and the project has no
      # published version yet. A `vX.Y.Z` tag adds its own: someone who wants to stay put can then
      # pin `1.2.3` or `1.2`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familiste
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
