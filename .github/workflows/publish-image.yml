name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Une seule publication à la fois par référence : deux push rapprochés sur main pousseraient deux
# images sous le même tag `latest`, et la dernière arrivée ne serait pas forcément la plus récente.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # amd64 et arm64 : un serveur à la maison est souvent un Raspberry Pi ou un Mac. La seconde
      # architecture est émulée, ce qui allonge le build, mais évite à ces machines de compiler
      # elles-mêmes ce que l'image est justement censée leur épargner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` suit main, parce que c'est ce que `compose.yml` demande et que le projet n'a pas
      # encore de version publiée. Un tag `vX.Y.Z` ajoute les siens : quelqu'un qui tient à ne pas
      # bouger peut alors épingler `1.2.3` ou `1.2`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familiste
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
