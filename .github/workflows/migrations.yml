name: Migrations

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: migrations-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST || 'aws-1-eu-west-3.pooler.supabase.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build the database URL
        run: |
          password=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$password"
          echo "DB_URL=postgresql://postgres.${{ vars.SUPABASE_PROJECT_REF }}:${password}@${SUPABASE_DB_HOST}:5432/postgres" >> "$GITHUB_ENV"

      - name: Migrations en attente
        run: supabase db push --db-url "$DB_URL" --dry-run

      - name: Application en prod
        run: supabase db push --db-url "$DB_URL"
