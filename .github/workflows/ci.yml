name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both jobs compile the app, which reads these variables at build time. They are the ones of the
# local Supabase stack, public by design: CI reaches no online project.
env:
  PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

# A push that catches up with another cancels the run in progress: what matters is the latest state
# of the branch, not every intermediate state.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast and with no external dependency: svelte-check plus unit coverage of the pure logic.
  # Kept apart from the rest to get feedback before Supabase has even finished starting in the
  # e2e job.
  check-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Unit tests (coverage ≥ 80% on pure logic)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # The CLI comes from `package.json`, not from an action tracking a floating version: CI and
      # the developer's machine then apply the same migrations with the same tool. A CLI that is
      # too old rejects `supabase/config.toml`, and nobody wants to find that out here.
      #
      # `db reset` applies the migrations then `supabase/seed.sql`, which creates the fixed account
      # used by the E2E tests (e2e@familist.test), confirmed and approved without mail or service key.
      - name: Local Supabase stack
        run: |
          pnpm run db:start
          pnpm run db:reset

      # Includes `e2e/a11y.spec.ts`: axe-core runs on the main screens, signed-in ones included, and
      # fails on any violation missing from `e2e/a11y-baseline.json`.
      - name: E2E and accessibility tests
        run: pnpm exec playwright test

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
