server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# Hashed file names: the browser may keep them for as long as it likes, a new build gives new names.
	location /_app/immutable/ {
		expires 1y;
		add_header cache-control "public, immutable";
	}

	# The one file that changes without the build changing. Kept out of every cache, otherwise moving an
	# instance to another database would leave people on the old one until they clear their browser.
	location = /config.js {
		add_header cache-control "no-store";
	}

	# Single-page app: every unknown path is a route of the app, not a missing file.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
